<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DragoraLabs Discord • Join the Dragon's Lair</title>
 
  <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/225836782?s=400&u=63eda859b6bcc3fb67c814d06eae921798814727&v=4" />
 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
 
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0a0e17;
      --accent: #00d4ff;
      --dragon-red: #ff4500;
      --text: #e0f7ff;
      --text-muted: #a3bffa;
      --card-bg: rgba(20, 25, 40, 0.75);
      --border: rgba(0, 212, 255, 0.18);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 15% 50%, rgba(0, 212, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(255, 69, 0, 0.06) 0%, transparent 45%);
      background-attachment: fixed;
      overflow-x: hidden;
    }
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(10, 14, 23, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
      padding: 1rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo-small {
      font-family: 'Orbitron', monospace;
      font-size: 2.2rem;
      background: linear-gradient(90deg, var(--dragon-red), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      text-decoration: none;
    }
    header {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 5%;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #0f172a 0%, #02040a 100%);
      z-index: -2;
    }
    header::after {
      content: "";
      position: absolute;
      inset: 0;
      background: url('https://avatars.githubusercontent.com/u/225836782?s=800&u=63eda859b6bcc3fb67c814d06eae921798814727&v=4') center/cover no-repeat;
      opacity: 0.06;
      mix-blend-mode: screen;
      z-index: -1;
    }
    .hero-content {
      max-width: 1100px;
      z-index: 2;
    }
    .logo-big {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 6px solid rgba(0,212,255,0.45);
      box-shadow: 0 0 60px rgba(255,69,0,0.6), 0 0 30px rgba(0,212,255,0.5);
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 5rem;
      font-family: 'Orbitron', monospace;
      background: linear-gradient(90deg, #ff4500, #ff8c00, #00d4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 20px rgba(255,69,0,0.5);
    }
    .subtitle {
      font-size: 1.7rem;
      max-width: 900px;
      margin: 0 auto 3rem;
      color: var(--text-muted);
    }
    .discord-widget {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      max-width: 580px;
      margin: 0 auto 4rem;
      text-align: center;
      box-shadow: 0 0 40px rgba(255,69,0,0.25);
    }
    .discord-widget h3 {
      font-size: 2.2rem;
      margin-bottom: 1.5rem;
      color: white;
    }
    .discord-status {
      font-size: 1.5rem;
      margin: 1.5rem 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      font-weight: 500;
    }
    .status-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #43b581;
      box-shadow: 0 0 16px #43b581, 0 0 30px #43b58180;
    }
    .join-btn {
      display: inline-flex;
      align-items: center;
      gap: 1.2rem;
      background: #5865F2;
      color: white;
      padding: 1.4rem 4rem;
      font-size: 1.6rem;
      font-weight: 700;
      border-radius: 50px;
      text-decoration: none;
      margin-top: 2.5rem;
      transition: all 0.4s ease;
      box-shadow: 0 0 35px rgba(88,101,242,0.5);
    }
    .join-btn:hover {
      transform: translateY(-6px) scale(1.07);
      box-shadow: 0 0 70px rgba(88,101,242,0.9);
      background: #4752c4;
    }
    .chart-container {
      max-width: 1000px;
      margin: 0 auto 6rem;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem;
      box-shadow: 0 0 50px rgba(0,212,255,0.15);
    }
    .chart-container h3 {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 2rem;
      color: white;
    }
    footer {
      text-align: center;
      padding: 6rem 5% 4rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    @media (max-width: 768px) {
      h1 { font-size: 3.8rem; }
      .logo-big { width: 160px; height: 160px; }
      .discord-widget { padding: 2rem; }
      .join-btn { font-size: 1.3rem; padding: 1.2rem 3rem; }
      .chart-container { padding: 2rem; }
    }
  </style>
</head>
<body>
  <nav class="topbar">
    <a href="#" class="logo-small">DragoraLabs</a>
    <a href="https://discord.gg/rScRjWjKPw" target="_blank" class="join-btn">
      <i class="fab fa-discord"></i> Join Discord
    </a>
  </nav>
  <header>
    <div class="hero-content">
      <img
        src="https://avatars.githubusercontent.com/u/225836782?s=400&u=63eda859b6bcc3fb67c814d06eae921798814727&v=4"
        alt="DragoraLabs Dragon"
        class="logo-big"
      />
      <h1>Dragon's Lair</h1>
      <p class="subtitle">
        Official DragoraLabs Discord<br>
        Free open-source tools • Community • Real-time help & fun
      </p>
      <!-- Live Discord widget + status + big join -->
      <div class="discord-widget">
        <h3>Live Server Status</h3>
        <div class="discord-status">
          <span class="status-dot"></span>
          <strong id="live-status">Connecting to Discord...</strong>
        </div>
        <!-- Big centered join button -->
        <a href="https://discord.gg/rScRjWjKPw" target="_blank" class="join-btn" style="margin-top: 2.5rem; font-size: 1.7rem; padding: 1.5rem 4.5rem;">
          <i class="fab fa-discord fa-2x"></i> Join the Server Now
        </a>
      </div>
      <!-- Growth chart -->
      <div class="chart-container">
        <h3>Community Growth</h3>
        <canvas id="growthChart" height="240"></canvas>
      </div>
    </div>
  </header>
  <footer>
    <p>
      <img src="" alt="DragoraLabs" class="footer-logo"/>
      © 2026 DragoraLabs • Free forever • Join the lair
    </p>
  </footer>
  <script>
    // Function to fetch real-time Discord server stats
    function fetchDiscordStats() {
      fetch('https://discord.com/api/v9/invites/rScRjWjKPw?with_counts=true')
        .then(response => response.json())
        .then(data => {
          const members = data.approximate_member_count;
          const online = data.approximate_presence_count;
          document.getElementById('live-status').innerHTML = `${members} members • <span style="color:#43b581">${online} Online now</span>`;
          // Update the chart with the latest member count
          growthChart.data.datasets[0].data[growthChart.data.datasets[0].data.length - 1] = members;
          growthChart.update();
        })
        .catch(error => {
          console.error('Error fetching Discord stats:', error);
          document.getElementById('live-status').innerHTML = 'Error loading stats';
        });
    }

    // Initial fetch
    fetchDiscordStats();

    // Auto-refresh every 60 seconds
    setInterval(fetchDiscordStats, 60000);

    // Dynamic labels for the last 7 months
    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const now = new Date();
    const currentMonth = now.getMonth();
    const labels = [];
    for (let i = 6; i >= 0; i--) {
      const monthIndex = (currentMonth - i + 12) % 12;
      labels.push(monthNames[monthIndex]);
    }

    // Reset initial data to lower numbers reflecting a smaller community
    const initialData = [1, 2, 4, 6, 9, 12, 19];

    // Chart.js - member growth line
    const ctx = document.getElementById('growthChart').getContext('2d');
    const growthChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Members',
          data: initialData,
          borderColor: '#00d4ff',
          backgroundColor: 'rgba(0, 212, 255, 0.2)',
          tension: 0.4,
          fill: true,
          pointBackgroundColor: '#ff4500',
          pointBorderColor: '#fff',
          pointHoverRadius: 12,
          pointRadius: 7,
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
        },
        scales: {
          y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.08)' } },
          x: { grid: { display: false } }
        }
      }
    });
  </script>
  <!-- WidgetBot Crate (floating bubble + live status) -->
  <script src="https://cdn.jsdelivr.net/npm/@widgetbot/crate@3" async defer>
    new Crate({
      server: '1409095276450545779',
      channel: '1474337848546037861',
      notifications: true,
      indicator: true,
      theme: '#ff4500',
      location: ['bottom', 'right']
    })
  </script>
</body>
</html>
